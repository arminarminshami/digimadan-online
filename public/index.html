<style>
:root{--ink:#14100c;--panel:#1d1710;--line:#3a2f1c;--gold:#d9ae33;--gold-soft:#f0d56a;--text:#f6efe0;--muted:#b9ab8e}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#2a2010 0%,var(--ink) 60%);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;
  padding:max(40px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));display:flex;justify-content:center}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
.logo{width:132px;height:132px;filter:drop-shadow(0 8px 28px rgba(217,174,51,.28))}
h1{margin-top:20px;font-size:28px;font-weight:800;letter-spacing:0}
.tag{margin-top:6px;color:var(--muted);font-size:15px}
ul{list-style:none;padding:0;margin:36px 0 0;width:100%;display:flex;flex-direction:column;gap:12px}
a.link{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  color:var(--text);text-decoration:none;transition:border-color .15s,background .15s}
a.link:hover{border-color:var(--gold);background:#251d12}
a.link:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.ic{flex:none;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold-soft),var(--gold));display:grid;place-items:center}
.ic svg{width:24px;height:24px;stroke:#2a1f08;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t{display:flex;flex-direction:column;gap:2px;min-width:0}
.t b{font-size:17px;font-weight:700}
.t span{font-size:13px;color:var(--muted)}
#profile{width:100%;display:flex;flex-direction:column;align-items:center}
#profile[hidden],#home[hidden]{display:none}
#home{width:100%;display:flex;flex-direction:column;align-items:center}
.back{align-self:flex-start;color:var(--muted);text-decoration:none;font-size:15px;padding:8px 0}
.back:hover{color:var(--gold-soft)}
.card{margin-top:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.avatar{width:148px;height:148px;border-radius:50%;border:3px solid var(--gold);background:#251d12 50% 22%/cover no-repeat;display:grid;place-items:center}
.avatar svg{width:56px;height:56px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round}
.card h2{margin-top:8px;font-size:24px;font-weight:800}
.role{color:var(--gold-soft);font-size:15px;font-weight:700}
.about-h{align-self:stretch;text-align:right;margin-top:14px;padding-top:16px;border-top:1px solid var(--line);font-size:17px;font-weight:800;color:var(--gold-soft)}
.bio{align-self:stretch;text-align:justify;color:#d8ccb4;font-size:15px;line-height:2.1;white-space:pre-line;margin-top:2px}
.cta{margin-top:14px;width:100%;display:flex;justify-content:center;align-items:center;gap:10px;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#2a1f08;font-weight:800;font-size:17px;text-decoration:none}
.cta:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.cta bdi{direction:ltr;unicode-bidi:isolate}
footer{margin-top:36px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

  bio: "اینجانب شامی، به‌عنوان فعال حوزه معدن، استخراج و فرآوری مواد معدنی، همواره از نزدیک با چالش‌ها و نیازهای فعالان این صنعت آشنا بوده‌ام. مشکلات معدن‌داران در زمینه بازاریابی و فروش محصولات معدنی، یافتن خریداران مناسب، چالش کارخانه‌های فرآوری در تأمین مواد اولیه و همچنین نیازهای پیمانکاران فعال در حوزه‌های اکتشاف، استخراج و فرآوری و فعالان حوزه ماشین‌آلات معدنی، از جمله مسائلی است که در طول فعالیت حرفه‌ای خود با آن‌ها مواجه شده‌ام.\n\nشناخت این چالش‌ها و تجربه مستقیم فعالیت در صنعت معدن، زمینه‌ساز شکل‌گیری ایده راه‌اندازی دیجی‌معدن (DigiMadan) شد؛ بستری تخصصی با هدف تسهیل ارتباط میان معدن‌داران، تأمین‌کنندگان، خریداران، پیمانکاران و کارخانه‌های فرآوری مواد معدنی.\n\nاین مجموعه با همکاری جناب آقای دکتر جعفری و در چارچوب مجموعه شرکت هامون راه‌اندازی شد تا با بهره‌گیری از ظرفیت‌های فضای دیجیتال، زمینه توسعه ارتباطات تجاری، تسهیل فرآیند خریدوفروش و بهبود دسترسی فعالان صنعت به بازارهای هدف فراهم شود.\n\nدر حال حاضر، علاوه بر فعالیت در حوزه معدن، به‌صورت مستقیم مسئولیت پشتیبانی و ارتباط با مشتریان دیجی‌معدن را نیز بر عهده دارم. باور دارم که ارائه خدمات مؤثر و کاربردی، مستلزم شناخت دقیق نیازها، شنیدن دغدغه‌ها و آگاهی از مشکلات واقعی کاربران است. به همین دلیل، ارتباط مستقیم با مشتریان را فرصتی ارزشمند برای شناسایی چالش‌ها، بهبود خدمات و توسعه مستمر دیجی‌معدن می‌دانم.\n\nاز این رو، تمامی فعالان صنعت معدن، اعم از معدن‌داران، تأمین‌کنندگان و خریداران مواد معدنی، کارخانه‌های فرآوری، پیمانکاران و فعالان حوزه ماشین‌آلات معدنی می‌توانند برای دریافت راهنمایی، طرح پرسش‌ها، ارائه پیشنهادها، پیگیری مسائل و بررسی زمینه‌های همکاری، به‌صورت مستقیم با اینجانب در ارتباط باشند.\n\nهدف من در دیجی‌معدن، فراتر از پشتیبانی کاربران است؛ تلاش می‌کنم با تکیه بر تجربه عملی در صنعت معدن و ارتباط مستمر با فعالان این حوزه، در مسیر رفع موانع، بهبود خدمات و ایجاد ارتباطات تجاری مؤثرتر گام بردارم.\n\nدیجی‌معدن؛ بستری برای ارتباط مؤثرتر و توسعه همکاری‌های تجاری در صنعت معدن و مواد معدنی.",

/* ===================================== */
const ICONS = {
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
  insta: '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/>',
  telegram: '<path d="M21 4 3 11l5.5 2L10 19l3-3.5 4.5 3.3z"/><path d="m8.5 13 8-6"/>',
  support: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/><path d="M19 20c0 1.2-1.8 2-5 2"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.1"/>'
};
const ul = document.getElementById('links');
LINKS.filter(l => l.profile ? PROFILE.phone : l.url).forEach(l => {
  const li = document.createElement('li');
  const attrs = l.profile ? 'href="#support"' : 'target="_blank" rel="noopener" href="' + l.url + '"';
  li.innerHTML = '<a class="link" ' + attrs + '>' +
    '<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[l.icon] + '</svg></span>' +
    '<span class="t"><b>' + l.title + '</b><span>' + l.sub + '</span></span></a>';
  ul.appendChild(li);
});
// صفحه معرفی
const $ = id => document.getElementById(id);
$('p-name').textContent = PROFILE.name;
$('p-role').textContent = PROFILE.role;
$('p-bio').textContent = PROFILE.bio;
$('p-bio').hidden = $('p-abouth').hidden = !PROFILE.bio;
$('p-num').textContent = PROFILE.phone;
$('p-call').href = 'tel:' + PROFILE.phone.replace(/[^\d+]/g, '');
if (PROFILE.photo) $('p-avatar').style.backgroundImage = 'url("' + PROFILE.photo + '")';
else $('p-avatar').innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.9-3.6 3.9-5.5 7.5-5.5s6.6 1.9 7.5 5.5"/></svg>';
function route(){
  const on = location.hash === '#support' && PROFILE.phone;
  $('profile').hidden = !on; $('home').hidden = !!on;
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route); route();
</script>
